# set leader + r to reload tmux config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf"

# set leader to ctrl + f
set -g prefix C-f

# set window base to 1
set -g base-index 1
setw -g pane-base-index 1

# allow mouse for resizing panes
set -g mouse on
set -g default-terminal "tmux-256color"

# allow inline images (kitty graphics passthrough)
set -gq allow-passthrough on
# let nvim see focus changes so image.nvim can hide images on pane switch
set -g focus-events on
# prefix + G: clear ghosted terminal images
bind G run-shell "$HOME/.config/tmux/clear-images.sh"

# bind vim keys for navigating panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# open new splits/windows in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# changes status bar to top
set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Show current directory basename as window name
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Ensure TPM is installed
if-shell "[ ! -d ~/.config/tmux/plugins/tpm ]" \
	"run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`


